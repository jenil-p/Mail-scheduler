version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sendly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sendly
      POSTGRES_PASSWORD: sendly_pass
      POSTGRES_DB: sendly
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sendly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

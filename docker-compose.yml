services:
  postgres:
    image: postgres:16-alpine
    container_name: sendly-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sendly
      POSTGRES_PASSWORD: sendly_pass
      POSTGRES_DB: sendly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sendly -d sendly"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sendly-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sendly-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    # Secrets (Google OAuth, JWT) live in backend/.env — see backend/.env.example
    env_file:
      - ./backend/.env
    # Infra wiring is set here so it wins over any localhost values in .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://sendly:sendly_pass@postgres:5432/sendly?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build time.
        # Browsers need the host-published URL (not the Docker service name);
        # the Google client ID comes from a root .env or the shell
        # (docker compose reads ./.env automatically for interpolation).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: sendly-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: